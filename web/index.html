<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vinslipp | Wine Releases &amp; Collection Tracking</title>
  <meta name="description" content="Track Systembolaget releases, manage your cellar, and explore auction data. Available on iOS.">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="home">
    <img class="app-icon" src="/icon.png" alt="Vinslipp" width="80" height="80">

    <div>
      <h1>Vinslipp</h1>
      <p class="tagline">Releases, cellar &amp; auction insights for wine lovers</p>
    </div>

    <div class="phone">
      <div class="screen">
        <img class="on" src="/screenshot-releases.png" alt="Releases">
        <img src="/screenshot-cellar.png" alt="Cellar">
        <img src="/screenshot-auction.png" alt="Auction">
      </div>
    </div>

    <div class="dots">
      <button class="on" aria-label="Releases"></button>
      <button aria-label="Cellar"></button>
      <button aria-label="Auction"></button>
    </div>

    <a class="store" href="https://apps.apple.com/app/vinslipp/id6758891213">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>
      Download on the App Store
    </a>

    <div class="footer">
      <a href="/privacy">Privacy</a>
      <a href="/support">Support</a>
    </div>

    <a class="social" href="https://www.instagram.com/vinslipp" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
      </svg>
    </a>
  </main>

  <script>
    const shots = document.querySelectorAll(".screen img");
    const dots = document.querySelectorAll(".dots button");
    let current = 0;
    function show(i) {
      current = i;
      shots.forEach((s, n) => s.classList.toggle("on", n === i));
      dots.forEach((d, n) => d.classList.toggle("on", n === i));
    }
    dots.forEach((d, i) => d.addEventListener("click", () => show(i)));
    setInterval(() => show((current + 1) % shots.length), 4000);
  </script>
</body>
</html>
