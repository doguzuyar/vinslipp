name: Send Wine Notification

on:
  workflow_dispatch:       # Triggered at 09:00 Stockholm time by a cron job on the Pi

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send push notifications per category
        run: |
          pip install google-auth requests
          python3 << 'PYEOF'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import google.auth.transport.requests
          from google.oauth2 import service_account
          import requests

          topics = {
              ("Frankrike", "Rött vin"): ("french-red", "French Red"),
              ("Frankrike", "Vitt vin"): ("french-white", "French White"),
              ("Italien", "Rött vin"): ("italian-red", "Italian Red"),
              ("Italien", "Vitt vin"): ("italian-white", "Italian White"),
          }
          today = datetime.now(ZoneInfo("Europe/Stockholm")).date().isoformat()
          with open("data/releases.json") as f:
              releases = json.load(f)
          by_topic = {}
          for w in releases.get("wines", []):
              topic = topics.get((w.get("country"), w.get("wineType")))
              if topic and w.get("launchDate") == today:
                  by_topic.setdefault(topic, []).append(w)
          if not by_topic:
              print(f"No releases on {today}")
              raise SystemExit

          sa_info = json.loads(os.environ["SA_KEY"])
          credentials = service_account.Credentials.from_service_account_info(
              sa_info,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )
          credentials.refresh(google.auth.transport.requests.Request())
          project_id = sa_info["project_id"]

          for (topic, label), wines in by_topic.items():
              wines.sort(key=lambda w: w.get("ratingScore") or 0, reverse=True)
              lines = []
              for w in wines[:5]:
                  name = f"{w.get('wineName', '')} {w.get('vintage', '')}".strip()
                  stars = "★" * (w.get("ratingScore") or 0)
                  lines.append(f"{name} {stars}" if stars else name)
              body_text = "\n".join(lines)
              if len(wines) > 5:
                  body_text += f"\n+{len(wines) - 5} more"

              message = {
                  "message": {
                      "topic": topic,
                      "data": {
                          "tab": "release"
                      },
                      "apns": {
                          "payload": {
                              "aps": {
                                  "alert": {
                                      "title": f"{label} releases",
                                      "body": body_text
                                  },
                                  "sound": "default",
                                  "badge": 1
                              }
                          }
                      }
                  }
              }

              response = requests.post(
                  f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send",
                  headers={
                      "Authorization": f"Bearer {credentials.token}",
                      "Content-Type": "application/json"
                  },
                  json=message
              )

              print(f"FCM [{topic}]: {response.status_code}")
              print(response.text)
              if response.status_code != 200:
                  print(f"::warning::Push notification failed for topic '{topic}'")
          PYEOF
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
